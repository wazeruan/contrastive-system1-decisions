[project]
name = "contrastive-system1-decisions"
version = "0.1.0"
description = "A reproducible dual-encoder study for structured tool selection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=0.28,<2",
  "numpy>=1.26,<3",
  "sentencepiece>=0.2,<1",
  "torch>=2.6,<3",
  "transformers>=4.50,<6",
]

[project.scripts]
csd = "contrastive_system1_decisions.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
